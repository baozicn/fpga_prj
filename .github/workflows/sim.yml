name: iverilog-sim

on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-numpy
      - name: Run sim
        shell: bash
        run: |
          set -e
          python3 tools/golden_gen.py
          iverilog -g2012 -o sim/sim.vvp sim/tb_axis_1080p.v uisrc/02_alg/vision/axis_sobel3x3.v uisrc/02_alg/vision/axis_frame_diff.v
          vvp sim/sim.vvp
          python3 tools/check_outputs.py
